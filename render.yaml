# Despliegue de la API en Render (Blueprint). Las variables con sync:false se piden al crear el servicio:
# la clave service_role se escribe ahí, nunca en el repositorio.
services:
  - type: web
    name: dashboard-qa-api
    runtime: docker
    plan: starter # el plan gratis se duerme y no enviaría los avisos programados
    healthCheckPath: /api/health
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: CORS_ORIGIN
        sync: false # ej: https://danielcamposb.github.io
      - key: AVISOS_SCHEDULER
        value: "1"
      - key: AVISOS_TZ
        value: America/Santiago
